name: CI

on:
  push:
    branches: [main, '2026-*/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm run test:integration
      - name: No-stub scan
        run: npm run no-stub-scan
      - name: Build
        run: npm run build

  runtime:
    name: PostgreSQL + Security + E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: verify
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: costco
          POSTGRES_PASSWORD: costco
          POSTGRES_DB: costco_saver_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U costco -d costco_saver_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://costco:costco@127.0.0.1:5432/costco_saver_test
      JWT_SECRET: ci-only-secret-change-me-0123456789abcdef
      TEST_API_URL: http://127.0.0.1:8080
      E2E_BASE_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Migrate database
        run: npm run db:migrate
      - name: Seed deterministic test data
        run: npm run db:seed:test
      - name: Build
        run: npm run build
      - name: Start production server
        run: |
          npm start > /tmp/costco-saver-api.log 2>&1 &
          echo $! > /tmp/costco-saver-api.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/costco-saver-api.log
          exit 1
      - name: Security isolation
        run: npm run test:security
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright E2E
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Upload API log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-log
          path: /tmp/costco-saver-api.log
          retention-days: 7
