# COSTCO-SAVER — DigitalOcean App Platform app spec.
# Used by scripts/deploy-do.sh and by Codemagic when the operator wants
# to spin up the web runtime independently of the iOS / Android builds.
#
# Per spec §84: production keys are env-injected at deploy time, never
# committed. Update the `env` block per environment.

name: costco-saver
region: nyc

services:
  - name: costco-saver-web
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    build_command: npm ci && npm run build
    run_command: npx serve -s dist -l 8080
    source_dir: /
    github:
      repo: ABBYCRM/COSTCO-SAVER
      branch: main
      deploy_on_push: true
    health_check:
      http_path: /
      port: 8080
      initial_delay_seconds: 30
      period_seconds: 30
      timeout_seconds: 5
      failure_threshold: 3
      success_threshold: 1
    envs:
      - key: NODE_ENV
        value: production
        scope: RUN_TIME
      - key: VITE_SUPABASE_URL
        value: ${VITE_SUPABASE_URL}
        scope: RUN_TIME
        type: GENERAL
      - key: VITE_SUPABASE_ANON_KEY
        value: ${VITE_SUPABASE_ANON_KEY}
        scope: RUN_TIME
        type: GENERAL
      - key: VITE_BRAND_RETAILER_NAME
        value: Costco
        scope: RUN_TIME

static_sites: []
databases: []
workers: []
functions: []
